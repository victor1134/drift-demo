apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-demo
  labels:
    app: drift-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drift-demo
  template:
    metadata:
      labels:
        app: drift-demo
    spec:
      containers:
        - name: guestbook
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
